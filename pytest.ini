[pytest]
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for individual functions/endpoints
    integration: Integration tests for multi-step workflows
    edge_case: Edge case and boundary condition tests
    smoke: Quick smoke tests for basic functionality

# Coverage settings
addopts = 
    --strict-markers
    --tb=short
    -ra

# Coverage configuration
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

fail_under = 80
